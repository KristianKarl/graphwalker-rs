[package]
name = "graphwalker-model-checker"
version = "1.0.1"
edition = "2021"
rust-version.workspace = true
license = "MIT"
readme = "../README.md"
description = "Model validation and checking for GraphWalker model-based testing"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "model-based-testing", "model-checking"]
categories = ["development-tools::testing"]

[dependencies]
graphwalker-core = { version = "1.0.1", path = "../graphwalker-core" }
graphwalker-dsl = { version = "1.0.1", path = "../graphwalker-dsl" }
graphwalker-io = { version = "1.0.1", path = "../graphwalker-io" }

[dev-dependencies]
serde_json = "1"
