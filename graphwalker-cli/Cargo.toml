[package]
name = "graphwalker"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Command-line model-based testing tool for GraphWalker"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "model-based-testing", "testing"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "graphwalker"
path = "src/main.rs"

[dependencies]
graphwalker-core = { version = "1.0.0", path = "../graphwalker-core" }
graphwalker-dsl = { version = "1.0.0", path = "../graphwalker-dsl" }
graphwalker-io = { version = "1.0.0", path = "../graphwalker-io" }
graphwalker-model-checker = { version = "1.0.0", path = "../graphwalker-model-checker" }
graphwalker-restful = { version = "1.0.0", path = "../graphwalker-restful" }
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
