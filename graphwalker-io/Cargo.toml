[package]
name = "graphwalker-io"
version = "1.0.3"
edition = "2021"
rust-version.workspace = true
description = "Model I/O for GraphWalker: JSON and GraphML/yEd format readers and writers"
license = "MIT"
readme = "../README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "graphml", "model-based-testing"]
categories = ["encoding"]

[dependencies]
graphwalker-core = { version = "1.0.3", path = "../graphwalker-core" }
graphwalker-dsl = { version = "1.0.3", path = "../graphwalker-dsl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42.0"
tracing = "0.1"
