[package]
name = "graphwalker-restful"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "REST and WebSocket API for GraphWalker model-based testing"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "model-based-testing", "rest", "websocket"]
categories = ["development-tools::testing", "web-programming::http-server"]

[dependencies]
graphwalker-io = { path = "../graphwalker-io" }
graphwalker-service = { path = "../graphwalker-service" }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
