[package]
name = "graphwalker-service"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
license = "MIT"
description = "Application services for GraphWalker model-based testing"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "model-based-testing", "testing"]
categories = ["development-tools::testing"]

[dependencies]
graphwalker-core = { path = "../graphwalker-core" }
graphwalker-dsl = { path = "../graphwalker-dsl" }
graphwalker-io = { path = "../graphwalker-io" }
graphwalker-model-checker = { path = "../graphwalker-model-checker" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
