[package]
name = "graphwalker-mcp"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
description = "Model Context Protocol server for GraphWalker"
license = "MIT"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "mcp", "model-based-testing"]
categories = ["development-tools::testing"]

[[bin]]
name = "graphwalker-mcp"
path = "src/main.rs"

[dependencies]
graphwalker-io = { path = "../graphwalker-io" }
graphwalker-service = { path = "../graphwalker-service" }
rmcp = { version = "=3.3.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
