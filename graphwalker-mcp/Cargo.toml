[package]
name = "graphwalker-mcp"
version = "1.0.3"
edition = "2021"
rust-version.workspace = true
description = "Model Context Protocol server for GraphWalker"
license = "MIT"
readme = "../README.md"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["graphwalker", "mcp", "model-based-testing"]
categories = ["development-tools::testing"]

[[bin]]
name = "graphwalker-mcp"
path = "src/main.rs"

[dependencies]
graphwalker-io = { version = "1.0.3", path = "../graphwalker-io" }
graphwalker-service = { version = "1.0.3", path = "../graphwalker-service" }
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
