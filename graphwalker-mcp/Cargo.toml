[package]
name = "graphwalker-mcp"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Model Context Protocol server for GraphWalker"
license = "MIT"

[[bin]]
name = "graphwalker-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.3.0", default-features = false, features = ["macros", "server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
serde_json = "1"
